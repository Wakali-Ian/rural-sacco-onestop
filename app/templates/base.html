<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Rural SACCO{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/app.css') }}" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container-fluid px-4">
        <a class="navbar-brand" href="{% if session.get('user_id') %}{{ url_for('dashboard.index') }}{% else %}{{ url_for('auth.login') }}{% endif %}">
            <span style="display:inline-block;width:28px;height:28px;background:linear-gradient(135deg,#3b82f6,#1e40af);border-radius:7px;line-height:28px;text-align:center;margin-right:8px;font-size:0.9rem;">R</span>
            Rural SACCO
        </a>
        {% if session.get('user_id') %}
        <div class="navbar-nav ms-auto align-items-center">
            <a class="nav-link" href="{{ url_for('dashboard.index') }}">Dashboard</a>
            <a class="nav-link" href="{{ url_for('members.list_members') }}">Members</a>
            <a class="nav-link" href="{{ url_for('reports.agm_pdf') }}">AGM PDF</a>
            <a class="nav-link" href="{{ url_for('auth.logout') }}">Logout</a>
        </div>
        {% endif %}
    </div>
</nav>
<div class="container-fluid px-4 py-4">
    {% with msgs = get_flashed_messages(with_categories=true) %}
        {% for cat, msg in msgs %}
            <div class="alert alert-{{ cat }} alert-dismissible fade show">
                {{ msg }}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
        {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
