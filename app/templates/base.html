<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Rural SACCO{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/app.css') }}" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="{{ url_for('dashboard.index') if session.get('user_id') else url_for('auth.login') }}">Rural SACCO</a>
        {% if session.get('user_id') %}
        <div class="navbar-nav ms-auto align-items-center">
            <a class="nav-link" href="{{ url_for('dashboard.index') }}">Dashboard</a>
            <a class="nav-link" href="{{ url_for('members.list_members') }}">Members</a>
            <a class="nav-link" href="{{ url_for('reports.agm_pdf') }}">AGM PDF</a>
            <a class="nav-link" href="{{ url_for('auth.logout') }}">Logout ({{ session.get('username') }})</a>
        </div>
        {% endif %}
    </div>
</nav>
<div class="container-fluid py-4">
    {% with msgs = get_flashed_messages(with_categories=true) %}
        {% for cat, msg in msgs %}
            <div class="alert alert-{{ cat }} alert-dismissible fade show">
                {{ msg }}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
        {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
