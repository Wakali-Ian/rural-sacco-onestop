{% extends "base.html" %}
{% block title %}Login - Rural SACCO{% endblock %}
{% block content %}
<div class="login-wrapper">
    <div class="login-card">
        <div class="login-logo">R</div>
        <h4 class="text-center mb-1">Rural SACCO</h4>
        <p class="text-center text-muted mb-4 small">Manager Console</p>
        <form method="post">
            <div class="mb-3">
                <label class="form-label small fw-semibold">Username</label>
                <input type="text" name="username" class="form-control" required autofocus>
            </div>
            <div class="mb-3">
                <label class="form-label small fw-semibold">Password</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2">Log in</button>
        </form>
        <div class="text-center mt-4">
            <small class="text-muted">Demo: <code>admin / admin123</code></small>
        </div>
    </div>
</div>
{% endblock %}
