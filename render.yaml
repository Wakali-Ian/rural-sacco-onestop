services:
  - type: web
    name: rural-sacco
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
   startCommand: python -m flask bootstrap && gunicorn run:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_APP
        value: run.py
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: rural-sacco-db
          property: connectionString
      - key: DEFAULT_LANGUAGE
        value: sw

databases:
  - name: rural-sacco-db
    plan: free
